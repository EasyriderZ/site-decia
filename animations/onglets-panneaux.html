<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onglets → panneaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0D11;
    --text:#F5F6FA;
    --accent:#0066FF;
    --surface:#16181E;
    --line:rgba(245,246,250,.10);
    --muted:rgba(245,246,250,.50);
    --move:cubic-bezier(.6,0,.2,1);
    --appear:cubic-bezier(.2,.8,.2,1);
    --dur:9s;                 /* 3 onglets × 3 s */
    --title:"Plus Jakarta Sans", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    display:grid;
    place-items:center;
    font-family:var(--mono);
  }

  /* Conteneur de référence pour les unités cqw */
  .frame{width:min(92vmin,640px);container-type:inline-size}
  .case{
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-rows:87cqw 13cqw;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:2.4cqw;
    overflow:hidden;
  }
  .stage{position:relative}

  /* ---------- Pilule d'onglets ---------- */
  .tabs{
    position:absolute;
    left:12cqw; top:11cqw;
    width:76cqw; height:9cqw;
    padding:.8cqw;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:rgba(245,246,250,.07);
    border:1px solid var(--line);
    border-radius:4.5cqw;
  }
  .indicator{
    position:absolute;
    left:.8cqw; top:.8cqw; bottom:.8cqw;
    width:calc((100% - 1.6cqw) / 3);
    background:var(--bg);
    border:1px solid rgba(245,246,250,.12);
    border-radius:3.7cqw;
    animation:indicator var(--dur) infinite;
  }
  .tab{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:2.5cqw;
    font-weight:500;
    white-space:nowrap;
    color:var(--muted);
  }
  .t1{color:var(--text);animation:t1 var(--dur) infinite}
  .t2{animation:t2 var(--dur) infinite}
  .t3{animation:t3 var(--dur) infinite}

  /* ---------- Carte et panneaux ---------- */
  .card{
    position:absolute;
    left:12cqw; top:26cqw;
    width:76cqw; height:54cqw;
    padding:4.4cqw 5cqw;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:1.6cqw;
  }
  .card-label{
    font-size:1.8cqw;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .panels{position:relative;height:41cqw;margin-top:2.6cqw}
  .panel{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0;
  }
  .p1{opacity:1;animation:p1 var(--dur) infinite}
  .p2{animation:p2 var(--dur) infinite}
  .p3{animation:p3 var(--dur) infinite}

  .big{
    font-family:var(--mono);
    font-weight:500;
    font-size:12cqw;
    line-height:1;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .big small{font-size:5cqw;color:var(--muted);letter-spacing:0;margin-left:.6cqw}
  .context{margin-top:1.6cqw;font-size:2.3cqw;color:var(--muted);white-space:nowrap}

  .chart{
    margin-top:auto;
    height:15cqw;
    display:flex; align-items:flex-end; gap:1.6cqw;
    border-bottom:1px solid rgba(245,246,250,.18);
  }
  .chart i{
    flex:1;
    height:var(--h);
    background:rgba(245,246,250,.18);
    border-radius:.6cqw .6cqw 0 0;
  }
  .chart i:last-child{background:var(--accent)}

  /* ---------- Titre de la case ---------- */
  .caption{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5cqw;
    border-top:1px solid var(--line);
  }
  .caption h2{font-family:var(--title);font-weight:700;font-size:3.6cqw}
  .caption span{font-size:2cqw;color:var(--muted)}

  /* ---------- Timeline (9 s, un changement toutes les 3 s) ----------
     Pour chaque changement, dans l'ordre :
       0,0–0,6 s   l'indicateur glisse vers l'onglet suivant
       0,5–0,8 s   le texte de l'onglet actif passe en clair
       0,6–0,9 s   l'ancien panneau s'efface
       0,9–1,3 s   le nouveau panneau apparaît
       1,3–3,0 s   pause
     Changements : vers 2 à 10 %, vers 3 à 43,33 %, retour vers 1 à 76,67 %
  */
  @keyframes indicator{
    0%,10%{translate:0 0;animation-timing-function:var(--move)}
    16.67%,43.33%{translate:100% 0;animation-timing-function:var(--move)}
    50%,76.67%{translate:200% 0;animation-timing-function:var(--move)}
    83.33%,100%{translate:0 0}
  }

  @keyframes t1{
    0%,15.56%{color:var(--text);animation-timing-function:var(--appear)}
    18.89%,82.22%{color:var(--muted);animation-timing-function:var(--appear)}
    85.56%,100%{color:var(--text)}
  }
  @keyframes t2{
    0%,15.56%{color:var(--muted);animation-timing-function:var(--appear)}
    18.89%,48.89%{color:var(--text);animation-timing-function:var(--appear)}
    52.22%,100%{color:var(--muted)}
  }
  @keyframes t3{
    0%,48.89%{color:var(--muted);animation-timing-function:var(--appear)}
    52.22%,82.22%{color:var(--text);animation-timing-function:var(--appear)}
    85.56%,100%{color:var(--muted)}
  }

  @keyframes p1{
    0%,16.67%{opacity:1;animation-timing-function:var(--appear)}
    20%,86.67%{opacity:0;animation-timing-function:var(--appear)}
    91.11%,100%{opacity:1}
  }
  @keyframes p2{
    0%,20%{opacity:0;animation-timing-function:var(--appear)}
    24.44%,50%{opacity:1;animation-timing-function:var(--appear)}
    53.33%,100%{opacity:0}
  }
  @keyframes p3{
    0%,53.33%{opacity:0;animation-timing-function:var(--appear)}
    57.78%,83.33%{opacity:1;animation-timing-function:var(--appear)}
    86.67%,100%{opacity:0}
  }

  @media (prefers-reduced-motion:reduce){
    .indicator,.tab,.panel{animation:none}
  }
  /* Intégration en iframe (bibliothèque de composants) : la case occupe tout le cadre */
  html.embed .frame{width:100vmin}
</style>
<script>if(window.self!==window.top)document.documentElement.classList.add('embed');</script>
</head>
<body>
  <div class="frame">
    <figure class="case">
      <div class="stage">
        <div class="tabs" role="tablist">
          <span class="indicator"></span>
          <span class="tab t1">Temps gagné</span>
          <span class="tab t2">Relances</span>
          <span class="tab t3">Factures</span>
        </div>

        <div class="card">
          <p class="card-label">Tableau de bord · client PME</p>
          <div class="panels">
            <div class="panel p1">
              <p class="big">6,5<small>h</small></p>
              <p class="context">gagnées par semaine sur la saisie</p>
              <div class="chart">
                <i style="--h:15%"></i><i style="--h:23%"></i><i style="--h:37%"></i><i style="--h:48%"></i>
                <i style="--h:58%"></i><i style="--h:71%"></i><i style="--h:88%"></i><i style="--h:100%"></i>
              </div>
            </div>

            <div class="panel p2">
              <p class="big">142</p>
              <p class="context">relances envoyées par l'agent en septembre</p>
              <div class="chart">
                <i style="--h:27%"></i><i style="--h:38%"></i><i style="--h:43%"></i><i style="--h:56%"></i>
                <i style="--h:62%"></i><i style="--h:73%"></i><i style="--h:85%"></i><i style="--h:100%"></i>
              </div>
            </div>

            <div class="panel p3">
              <p class="big">98<small>%</small></p>
              <p class="context">des factures traitées sans ressaisie</p>
              <div class="chart">
                <i style="--h:24%"></i><i style="--h:42%"></i><i style="--h:52%"></i><i style="--h:66%"></i>
                <i style="--h:76%"></i><i style="--h:84%"></i><i style="--h:90%"></i><i style="--h:100%"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <figcaption class="caption">
        <h2>Onglets → panneaux</h2>
        <span>05 · tableau de bord DecIA</span>
      </figcaption>
    </figure>
  </div>
</body>
</html>
